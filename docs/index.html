<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnviroView</title>
    <script type="module" crossorigin src="./assets/index-D_yrgEoR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BGksOcsG.css">
  </head>
  <body>
    <div id="app"></div>

    <h1>PEC EnviroView</h1>

    <!-- loading screen  -->
    <div id="loading-screen">
      <div class="loading-text gradient-text">
        Loading<span class="dot dot1">.</span><span class="dot dot2">.</span
        ><span class="dot dot3">.</span>
      </div>
    </div>

    <div class="kmz-upload-control">
      <label for="kmz-upload">Upload KMZ</label>
      <input id="kmz-upload" type="file" accept=".kmz" />
      <div id="kmz-status" class="kmz-status">Choose a KMZ file to load.</div>
      <button id="kmz-clear" type="button">Clear Uploads</button>
    </div>

    <div id="map" class="h-screen w-screen"></div>

  </body>
</html>
